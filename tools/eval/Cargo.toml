[package]
name = "cinekey-eval"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
cinekey = { path = "../..", default-features = false }
clap = { version = "4.5", features = ["derive"] }
hunch = "=2.0.2"
oleoo = "=3.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
caseless = "0.2.2"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
