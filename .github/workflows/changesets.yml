name: Changesets

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changesets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find pending changesets
        id: changesets
        shell: bash
        run: |
          if compgen -G '.changeset/*.md' >/dev/null; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Knope
        if: steps.changesets.outputs.pending == 'true'
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/knope-dev/knope/releases/download/knope/v0.23.0/knope-x86_64-unknown-linux-musl.tgz \
            --output "$RUNNER_TEMP/knope.tgz"
          echo "76a970a5e237344abc14be3de37ed50c021b659a9b66b3f54afc77e6d48ac501  $RUNNER_TEMP/knope.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/knope.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/knope-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Prepare Release PR
        if: steps.changesets.outputs.pending == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          knope prepare-release
          gh workflow run ci.yml --ref knope/release

  release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.head_ref == 'knope/release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag and dispatch release
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cinekey") | .version')
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "$tag^{commit}")" = "$COMMIT"
          else
            tag_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" -f message="cinekey $version" -f object="$COMMIT" -f type=commit --jq .sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_sha"
          fi
          gh workflow run release.yml --ref "$tag" --field tag="$tag"
