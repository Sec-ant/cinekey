name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release; leave empty to build branch artifacts"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      bundle: ${{ steps.metadata.outputs.bundle }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - id: metadata
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cinekey") | .version')
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "Tag $tag must match package version v$version." >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          bundle="$version"
          if [[ -z "$tag" ]]; then
            bundle="$version-g${commit:0:7}"
          fi
          {
            echo "version=$version"
            echo "bundle=$bundle"
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  cli:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE: ${{ needs.prepare.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build CLI
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --locked --profile dist --target "$TARGET" --bin cinekey
      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/dist/cinekey" dist/package/cinekey
          ln dist/package/cinekey dist/package/ck
          cp README.md LICENSE dist/package/
          dist/package/cinekey --version
          COPYFILE_DISABLE=1 tar -C dist/package -czf "dist/cinekey-$BUNDLE-$TARGET.tar.gz" cinekey ck README.md LICENSE
      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/$env:TARGET/dist/cinekey.exe" dist/package/cinekey.exe
          Copy-Item dist/package/cinekey.exe dist/package/ck.exe
          Copy-Item README.md, LICENSE dist/package/
          & dist/package/cinekey.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/package/* -DestinationPath "dist/cinekey-$env:BUNDLE-$env:TARGET.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli-${{ matrix.target }}
          path: dist/cinekey-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  wasm:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bindings: [web, nodejs]
    env:
      BINDINGS: ${{ matrix.bindings }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUNDLE: ${{ needs.prepare.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/wasm-bindgen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build and package Wasm
        run: |
          cargo build --locked --profile dist -p cinekey-wasm --target wasm32-unknown-unknown
          mkdir -p dist/package
          wasm-bindgen --target "$BINDINGS" --remove-name-section --remove-producers-section \
            --out-name cinekey --out-dir dist/package target/wasm32-unknown-unknown/dist/cinekey_wasm.wasm
          jq -n --arg version "$VERSION" --arg bindings "$BINDINGS" \
            '{name: "cinekey-wasm", version: $version, license: "MIT", main: "cinekey.js", types: "cinekey.d.ts",
              type: (if $bindings == "web" then "module" else "commonjs" end),
              repository: "https://github.com/Sec-ant/cinekey"}' > dist/package/package.json
          cp README.md LICENSE dist/package/
          tar -C dist -czf "dist/cinekey-$BUNDLE-wasm-$BINDINGS.tar.gz" package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wasm-${{ matrix.bindings }}
          path: dist/cinekey-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npm:
    needs: [prepare, wasm]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUNDLE: ${{ needs.prepare.outputs.bundle }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-wasm-*
          path: dist
          merge-multiple: true
      - name: Package npm module
        run: |
          for bindings in web nodejs; do
            mkdir -p "pkg/$bindings"
            tar -xzf "dist/cinekey-$BUNDLE-wasm-$bindings.tar.gz" -C "pkg/$bindings" --strip-components=1
          done
          bash scripts/npm-package.sh "$VERSION" "$COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm
          path: dist/cinekey-*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: needs.prepare.outputs.tag != ''
    needs: [prepare, check, cli, wasm, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare GitHub Release
        id: release
        shell: bash
        run: |
          (cd dist && sha256sum cinekey-* > SHA256SUMS)
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v version="$VERSION" '
              /^## / {
                if (active) exit
                active = ($2 == version)
                next
              }
              active { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            test -s "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --draft --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "cinekey $TAG" "${flags[@]}"
          fi
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" dist/* --clobber
          fi
      - name: Check registry version
        id: registry
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --user-agent "cinekey-release (https://github.com/$GH_REPO)" \
            https://index.crates.io/ci/ne/cinekey --output "$RUNNER_TEMP/crate-index.jsonl"
          if jq --slurp --exit-status --arg version "$VERSION" \
            'any(.[]; .vers == $version)' "$RUNNER_TEMP/crate-index.jsonl" >/dev/null; then
            jq --slurp --exit-status --arg version "$VERSION" \
              '.[] | select(.vers == $version) | .yanked == false' "$RUNNER_TEMP/crate-index.jsonl"
            curl --fail --location --silent --show-error --retry 3 \
              --user-agent "cinekey-release (https://github.com/$GH_REPO)" \
              "https://static.crates.io/crates/cinekey/cinekey-$VERSION.crate" \
              --output "$RUNNER_TEMP/published.crate"
            tar -xzOf "$RUNNER_TEMP/published.crate" "cinekey-$VERSION/.cargo_vcs_info.json" \
              | jq --exit-status --arg sha "$COMMIT" '.git.sha1 == $sha and .git.dirty != true'
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust
        if: steps.registry.outputs.published != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Authenticate to crates.io
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p cinekey --registry crates-io
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish npm package
        shell: bash
        run: |
          status=$(curl --location --silent --show-error --retry 3 \
            --write-out '%{http_code}' --output "$RUNNER_TEMP/npm-version.json" \
            "https://registry.npmjs.org/cinekey/$VERSION")
          case "$status" in
            200)
              jq --exit-status --arg sha "$COMMIT" \
                '.gitHead == $sha' "$RUNNER_TEMP/npm-version.json"
              ;;
            404)
              dist_tag=latest
              if [[ "$VERSION" == *-* ]]; then dist_tag=next; fi
              npm publish "./dist/cinekey-$VERSION.tgz" --tag "$dist_tag"
              ;;
            *)
              echo "npm registry returned HTTP $status." >&2
              exit 1
              ;;
          esac
      - name: Publish GitHub Release
        if: steps.release.outputs.draft == 'true'
        run: gh release edit "$TAG" --draft=false
