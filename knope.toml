[package]
versioned_files = [
    "Cargo.toml",
    "crates/cinekey-wasm/Cargo.toml",
    "tools/eval/Cargo.toml",
    { path = "Cargo.lock", dependency = "cinekey" },
    { path = "Cargo.lock", dependency = "cinekey-wasm" },
    { path = "tools/eval/Cargo.lock", dependency = "cinekey" },
    { path = "tools/eval/Cargo.lock", dependency = "cinekey-eval" },
]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[github]
owner = "Sec-ant"
repo = "cinekey"

[[workflows]]
name = "change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C knope/release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m 'chore(release): v$version'"

[[workflows.steps]]
type = "Command"
command = "git push --force-with-lease --set-upstream origin knope/release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore(release): v$version"

[workflows.steps.body]
template = "Merge this PR to publish cinekey $version to crates.io, npm, and GitHub Releases.\n\n$changelog"
