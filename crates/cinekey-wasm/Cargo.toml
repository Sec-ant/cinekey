[package]
name = "cinekey-wasm"
version = "0.2.5"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings for the cinekey media name parser"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cinekey = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = { version = "=0.2.129", default-features = false, features = ["std"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
