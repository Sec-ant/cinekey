[package]
name = "cinekey"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Explainable parser for movie and TV release names"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Sec-ant/cinekey"
keywords = ["media", "parser", "movies", "television", "cli"]
categories = ["parser-implementations", "command-line-utilities"]
include = ["src/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = "warn"

[[bench]]
name = "parse"
harness = false
