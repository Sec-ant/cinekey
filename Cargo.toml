[package]
name = "cinekey"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Fast parser for movie and TV release names"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Sec-ant/cinekey"
keywords = ["media", "parser", "movies", "television", "cli"]
categories = ["parser-implementations", "command-line-utilities"]
include = ["src/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[workspace]
members = ["crates/cinekey-wasm"]
default-members = ["."]
exclude = ["tools/eval"]
resolver = "3"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde_json"]

[[bin]]
name = "cinekey"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
enumset = { version = "1.1", default-features = false, features = ["serde"] }
memchr = "2.8"
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = "warn"

[[bench]]
name = "parse"
harness = false
